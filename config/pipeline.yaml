# HUTrackDB pipeline configuration
#
# =============================================================================
# CALIBRATION PROVENANCE REGISTER
# =============================================================================
# This project forbids fabricated quantitative values. Every tunable number
# below therefore carries:
#
#   value    - the number in force
#   status   - one of:
#                sourced    : traceable to an external authority or a project
#                             data file; usable without further approval
#                confirmed  : no external source exists; explicitly approved
#                             by the PI on the date recorded
#                UNCONFIRMED: no source and no approval. The pipeline REFUSES
#                             TO RUN while any in-use parameter has this
#                             status. Set a value and change the status only
#                             with PI approval.
#   source   - citation (URL / document / data file) or the approval record
#
# hutrackdb.config enforces this at load time. Do not add a bare number to
# this file without the accompanying status and source keys.
# =============================================================================

calibration:

  bypass_radius_km:
    value: 111.12
    status: confirmed
    confirmed_by: PI
    confirmed_on: 2026-08-05
    source: >
      60 nautical miles exactly (60 x 1.852 km/nmi = 111.12 km). Adopted from
      the default proximity search radius used by NOAA's Historical Hurricane
      Tracks tool (https://coast.noaa.gov/hurricanes/), which is a designated
      cross-check reference for this project. Using the same radius as the
      reference tool makes bypass counts directly comparable against it.
      NOTE: this parameter only sets the boolean `is_bypass` label. The
      continuous field `min_distance_to_coast_km` is written to every track
      point unconditionally, so any downstream team may re-threshold at any
      radius without re-running the pipeline.

  gate_spacing_km:
    value: 50.0
    status: confirmed
    confirmed_by: PI
    confirmed_on: 2026-08-05
    source: >
      No external authority defines a coastal gate spacing; this is an
      analyst-chosen resolution explicitly approved by the PI on 2026-08-05
      in preference to a county-keyed alternative. It controls only the
      granularity of the DEFAULT synthetic gate set. The gate module is
      swappable: a user-supplied gate file bypasses this parameter entirely
      (see docs/GATES.md).

  basemap_simplify_deg:
    value: 0.01
    status: sourced
    source: >
      Display-only simplification tolerance for the notebook's map extract,
      bounded by the rendering resolution rather than chosen freely: the map
      spans ~33 degrees of longitude across roughly 1,000 device pixels, i.e.
      ~0.033 deg/px, so 0.01 deg moves a vertex by under a third of a pixel and
      is invisible at any scale the file is drawn at. It affects NO computed
      value -- landfall detection always uses the full-precision coastline.

  confidence_level:
    value: 0.95
    status: confirmed
    confirmed_by: PI
    confirmed_on: 2026-10-07
    source: >
      Coverage of every uncertainty interval drawn by
      scripts/enso_gulf_analysis.py: Wilson score intervals on proportions and
      the Wald band on the logistic fit. Conventional level, explicitly
      approved by the PI on 2026-10-07. Analysis-only; it changes no value in
      the database.

  landfall_segment_step_km:
    value: 1.0
    status: sourced
    source: >
      Numerical tolerance, not a substantive calibration. This is the maximum
      chord length used when densifying a great-circle track segment before
      intersecting it with the land polygon, and therefore bounds the
      positional error of a computed landfall crossing point. It is set at
      1.0 km because that is finer than the positional precision of the
      source data itself: HURDAT2 records latitude/longitude to 0.1 degree,
      i.e. ~11.1 km of latitude (HURDAT2 format specification, data-line
      fields 5-6). Densifying below the data's own precision cannot add
      accuracy, so this value is bounded by the source rather than chosen.

# =============================================================================
# LANDFALL DEFINITION
# =============================================================================
# The landfall rule is deliberately geometric and threshold-free: a landfall
# occurs where the storm-center track crosses from water into a land polygon.
# There is no distance cutoff to tune. See docs/LANDFALL_METHODOLOGY.md.
landfall:

  # Barrier islands: PI decision 2026-08-05 was "both, as separate columns".
  # Implemented WITHOUT an invented area threshold:
  #   is_landfall           - true for a crossing onto ANY land polygon
  #                           (inclusive definition; matches NHC practice and
  #                           therefore matches HURDAT2's own native L flags)
  #   is_mainland_landfall  - true only when the land struck is the single
  #                           largest connected landmass (continental North
  #                           America). Determined by structural identity, not
  #                           by an area cutoff.
  #   landmass_area_km2     - the actual area of the landmass struck, emitted
  #                           as a continuous column so any team may draw its
  #                           own island/mainland boundary post hoc.
  emit_mainland_column: true
  emit_landmass_area: true

  # Require the system to be a tropical/subtropical cyclone at the crossing
  # for the crossing to be labelled a landfall. HURDAT2 status codes
  # TD/TS/HU/SD/SS. Extratropical crossings are still recorded but flagged via
  # the `status` column; set false to label them as landfalls too.
  require_tropical_status: false

  # Minimum intensity for a crossing to be recorded. null = record all
  # crossings regardless of intensity. Filtering is left to downstream users
  # so the database stays generic.
  min_wind_kt: null

# =============================================================================
# COASTLINE / LAND POLYGON SOURCE  (swappable - see docs/COASTLINE.md)
# =============================================================================
coastline:
  # Default: Natural Earth 1:10m Admin-1 States/Provinces. Public domain.
  # Chosen because a single file supplies BOTH the land polygon used for
  # crossing detection AND the state/country attribution needed for the
  # landfall_state field, avoiding a second, possibly inconsistent, source.
  source_name: natural_earth_10m_admin_1
  path: data/raw/coastline/ne_10m_admin_1_states_provinces/ne_10m_admin_1_states_provinces.shp
  url: https://naciscdn.org/naturalearth/10m/cultural/ne_10m_admin_1_states_provinces.zip
  # The download is a zip; the pipeline reads the shapefile extracted from it
  # into `path`'s parent directory. scripts/fetch_sources.py handles both.
  archive: data/raw/coastline/ne_admin1.zip
  retrieved: 2026-08-05
  sha256: efc59726337323058f9446210adc96673179cd344e053666ee3d28cb58ba2b05
  license: Public domain (Natural Earth)

  # ---- USER OVERRIDE -------------------------------------------------------
  # To substitute a higher-resolution or proprietary coastline, set
  # `override_path` to any file geopandas can read (.shp/.gpkg/.geojson/
  # .parquet) containing polygon geometry, and map the attribute columns.
  # Nothing else in the pipeline needs to change.
  # Example: NOAA Medium Resolution Shoreline, or Census TIGER/Line.
  override_path: null
  # Column in the override file naming the first-level admin unit (US state).
  admin1_column: name
  # Column naming the country.
  country_column: admin
  # Column holding an ISO country code, used to identify US features.
  iso_country_column: iso_a2

# =============================================================================
# LANDFALL GATES  (swappable - see docs/GATES.md)
# =============================================================================
gates:
  # Generator for the default gate set: `uniform` places gates at fixed
  # spacing along the extracted coastline (spacing from calibration above).
  generator: uniform

  # ---- USER OVERRIDE -------------------------------------------------------
  # Drop in a proprietary gate set by pointing `override_path` at a file in
  # the documented gate interchange format (GeoJSON/GPKG/CSV; see
  # docs/GATES.md for the required columns). The core pipeline logic is
  # untouched by this substitution.
  override_path: null

  # Region filter for default gate generation. Gates are generated only along
  # the coastlines of these countries (ISO A2). Keeps the default set focused
  # on the US and the adjacent coasts storms traverse before reaching it.
  countries: [US, MX, BS, CU, CA, BZ, JM, HT, DO, PR, VI, KY, TC]

# =============================================================================
# NOTEBOOK DISPLAY BASEMAP  (regenerated by every build)
# =============================================================================
# The EDA notebook draws its map on a small committed extract so a fresh clone
# renders without downloading the full coastline. It is DERIVED from whichever
# coastline is configured above, and `python -m hutrackdb build` rewrites it --
# so substituting a coastline updates the map automatically and the figure can
# never disagree with the data beside it.
#
# DISPLAY ONLY. Landfall detection always uses the full-precision coastline.
basemap:
  enabled: true
  path: data/reference/basemap_na_coast.parquet
  # Display window, padded beyond the plotted extent so no polygon is cut at
  # the frame edge. Scope, not calibration: it selects features to draw and
  # changes no computed value.
  bbox: [-102.0, 21.0, -63.0, 50.0]
  # Filtered against coastline.iso_country_column. If a substituted source uses
  # different country codes, change these to match.
  countries: [US, MX, CU, BS, CA]

# =============================================================================
# BASIN SCOPE
# =============================================================================
basins:
  atlantic:
    enabled: true
    path: data/raw/hurdat2/hurdat2-atl-1851-2025-092326.txt
    url: https://www.nhc.noaa.gov/data/hurdat/hurdat2-1851-2025-092326.txt
    retrieved: 2026-10-07
    sha256: 75202780ce56c8458f16fbef5fb8a026b99b00878dbb95c458211b3e6ef125b4
  pacific:
    enabled: true
    path: data/raw/hurdat2/hurdat2-nepac-1949-2025-092926.txt
    url: https://www.nhc.noaa.gov/data/hurdat/hurdat2-nepac-1949-2025-092926.txt
    retrieved: 2026-10-07
    sha256: caece626f7038db64a803a73f5985b563693f0130f3ff16b4b0a0a93c7aa0507

# =============================================================================
# QA REFERENCE
# =============================================================================
# NOAA/AOML's independently-compiled list of continental U.S. hurricane
# landfalls, used by `hutrackdb qa` as an external cross-check. It is revised
# alongside HURDAT2 each spring.
qa_reference:
  path: data/raw/reference/all_us_hurricanes.html
  url: https://www.aoml.noaa.gov/hrd/hurdat/All_U.S._Hurricanes.html
  retrieved: 2026-08-05
  # Deliberately unpinned: this is a live HTML page, not a versioned release,
  # so its bytes change with page furniture as well as with content. Pinning it
  # would produce a checksum failure that means nothing.
  sha256: null

# =============================================================================
# ENSO / GULF GENESIS ANALYSIS INPUTS  (scripts/enso_gulf_analysis.py)
# =============================================================================
# Inputs to a downstream analysis, NOT to the database build: changing them
# never makes the committed Parquet stale.
analysis:
  # NOAA CPC Relative Oceanic Nino Index, the official ENSO index from
  # 2026-02-01 (NWS Public Information Statement 26-05). Overlapping 3-month
  # seasons, 1950 to present. Classification rule: hutrackdb/constants.py.
  roni:
    path: data/raw/enso/RONI.ascii.txt
    url: https://www.cpc.ncep.noaa.gov/data/indices/RONI.ascii.txt
    retrieved: 2026-10-07
    # Deliberately unpinned: CPC appends a season every month and may revise
    # recent values, so a checksum would fail without meaning anything.
    sha256: null

  # CPC's official season-by-season El Nino / La Nina labels (the coloured
  # "Cold & Warm Episodes by Season" table). THIS is the source of truth for
  # ENSO state -- PI decision 2026-10-07. The documented rule applied to
  # RONI.ascii.txt cannot reproduce it exactly (CPC classifies from unrounded
  # internal values; ties differ on 4 seasons in 1984), so the rule runs only
  # as a cross-check, and as the fallback for any season the table lacks.
  enso_episodes:
    path: data/raw/enso/roni_episodes.html
    url: https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/
    retrieved: 2026-10-07
    # Live HTML page; its bytes change with page furniture. Unpinned.
    sha256: null

  # Natural Earth 1:10m marine area polygons, which name the water bodies.
  # Public domain; same publisher as the coastline.
  marine_polygons:
    path: data/raw/marine/ne_10m_geography_marine_polys.zip
    url: https://naciscdn.org/naturalearth/10m/physical/ne_10m_geography_marine_polys.zip
    retrieved: 2026-10-07
    sha256: a2d3395904c41e718e02c3ec5bc988712164c524c236fad32d95d282ca303b2a
    license: Public domain (Natural Earth)

  # "The Gulf" for genesis purposes = the union of these named polygons.
  # PI decision 2026-10-07. Natural Earth splits the Bay of Campeche off as its
  # own feature; IHO S-23 (Limits of Oceans and Seas) counts it as part of the
  # Gulf, so it is included. A definition by name carries no numeric bounds.
  gulf_polygon_names: ["Gulf of Mexico", "Bahía de Campeche"]

  # Genesis = the first track point whose status is tropical or subtropical
  # (constants.TROPICAL_STATUSES), so precursor LO/DB/WV stages are skipped.
  # PI decision 2026-10-07.

# =============================================================================
# OUTPUT
# =============================================================================
output:
  dir: data/processed
  geopackage: hutrackdb.gpkg
  sqlite: hutrackdb.sqlite
  parquet_dir: parquet
  # Snowflake DDL is emitted here; loading is a separate, credentialed step.
  snowflake_ddl: snowflake_ddl.sql
  snowflake_database: HUTRACKDB
  snowflake_schema: PUBLIC
